name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Vitest tests
        run: pnpm test

      - name: Run Next.js production build
        run: pnpm build
        env:
          CI: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/invensmart_ci"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/invensmart_ci"
          AUTH_SECRET: "ci-auth-secret-for-testing-at-least-32-chars"
          CRON_SECRET: "ci-cron-secret-for-testing"
          AI_ENABLED: "false"
          APP_URL: "http://localhost:3000"
